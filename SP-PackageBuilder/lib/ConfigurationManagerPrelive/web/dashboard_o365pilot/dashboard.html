<!DOCTYPE html>
<html ng-app="dashboard">
<head>
    <meta charset="utf-8" />
    <title>Office Proplus Readiness Dashboard</title>
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="O365 Updates Dashboard" />
    <meta name="keywords" content="Office 365, O365, Dashboard" />

    <link href="../css/c3.min.css" rel="stylesheet" type="text/css" />
    <link href="../css/columns.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />

    <script src="../js/angular.min.js" type="text/javascript"></script>
    <script src="../js/utility.js" type="text/javascript"></script>
    <script src="../js/d3.min.js" type="text/javascript"></script>
    <script src="../js/c3.min.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <noscript>Javascript is not enabled</noscript>
</head>
<body id="O365PilotDashboardBody" ng-controller="dashboardController">
        <div class="tile-container-2-6-short">
            <div class="tile-container-2-2-short">
                <label for="SMS_DeviceCollections" ng-bind="getString('DeviceCollection')"></label>
                <select name="SMS_DeviceCollections" id="SMS_DeviceCollectionsSelector" ng-options="collection as collection.Name for collection in SMS_DeviceCollections.All"
                        ng-model="SMS_DeviceCollections.Selected" ng-change="SMS_DeviceCollectionChanged()" tabindex="1" aria-label="{{getString('DeviceCollection')}}"></select>
                <button type="button" ng-click="LaunchWizardCollectionPicker()" ng-bind="getString('Browse')" tabindex="1"></button>
            </div>
        </div>
        <br class="clear">
        <br class="clear">
        <div class="tile-container-2-6" id="TopContainer">
            <div class="tile tile-2-1" id="GeneratePilot">
                <h1 tabindex="1" style="font-weight: bold;" ng-bind="getString('GeneratePilot')"></h1>
                <br class="clear">
                <br class="clear">
                <div tabindex="1" class="generate-pilot-text" id="GeneratePilotText" ng-bind="getString('PilotNotGenerated')" style="text-align:start"></div>
                <br class="clear">
                <br class="clear">
                <button class="clickable" tabindex="1" ng-keypress="keyPressToggle($event, 1)" ng-click="generatePilotCollection()">{{strings.GeneratePilot}}</button>
            </div>
            <div class="tile tile-2-3" id="SecondTile">
                <h1 id="RecommendedPilotDevicesTitle" tabindex="1" style="font-weight: bold;" ng-bind="getString('RecommendedPilotDevices')"></h1>
                <div>
                    <div id="RecommendedPilotDevices" dashboard-chart chart-status="RecommendedPilotDevicesStatus" tabindex="1"></div>
                    <div>
                        <h2 tabindex="1"style="text-anchor:middle;text-align:center;text-align-last:center; padding:4px 7px 2px 10px;"><a tabindex="1" href="https://go.microsoft.com/fwlink/?linkid=2110380" target="_blank" ng-bind="getString('LearnMore')"></a></h2>
                    </div>
                </div>
            </div>
            <div class="tile-container-2-1">
                <div class="tile tile-1-3" id="DeployPilot">
                    <h1 tabindex="1" style="font-weight: bold;" ng-bind="getString('DeployPilotCollection')"></h1>
                    <button class="clickable" tabindex="1" ng-keypress="keyPressToggle($event, 2)" ng-disabled="hasPermissionToCreatePOD == false" ng-click="deployPilotCollection()">{{strings.DeployPilotCollection}}</button>
                </div>
                <div class="tile tile-1-5" id="FifthTile">
                    <h1 id="DevicesSendingHealthDataTitle" tabindex="1" style="font-weight: bold;" ng-bind="getString('DevicesSendingHealthData')"></h1>
                    <div>
                        <div id="DevicesSendingHealthData" dashboard-chart chart-status="DevicesSendingHealthDataStatus" tabindex="1"></div>
                        <div>
                            <h2 tabindex="1"style="text-anchor:start;text-align:center;text-align-last:center"><a tabindex="1" href="https://go.microsoft.com/fwlink/?linkid=2104301" target="_blank" ng-bind="getString('LearnMore')"></a></h2>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tile tile-2-6" id="ThirdTile">
                <h1 id="DevicesReadyToDeployTitle" tabindex="1" style="font-weight: bold;" ng-bind="getString('DevicesReadyToDeploy')"></h1>
                <div>
                    <div id="DevicesReadyToDeploy" dashboard-chart chart-status="DevicesReadyToDeployStatus" tabindex="1" ng-keypress="keyPressDrillThrough($event, 'DevicesReadyToDeploy')"></div>
                    <div>
                        <h2 tabindex="1"style="text-anchor:middle;text-align:center;text-align-last:center; padding:4px 7px 2px 10px;"><a tabindex="1" href="https://go.microsoft.com/fwlink/?linkid=2110469" target="_blank" ng-bind="getString('LearnMore')"></a></h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="tile-container-2-6">
            <div class="tile tile-2-2">
                <h1 id="DevicesNotMeetingHealthGoalsTitle" tabindex="1" style="font-weight: bold;" ng-bind="getString('DevicesNotMeetingHealthGoals')"></h1>
                <div>
                    <div id="DevicesNotMeetingHealthGoals" dashboard-chart chart-status="DevicesNotMeetingHealthGoalsStatus" tabindex="1" ng-keypress="keyPressDrillThrough($event, 'DevicesNotMeetingHealthGoals')"></div>
                    <div>
                        <h2 tabindex="1"style="text-anchor:middle;text-align:center;text-align-last:center; padding:4px 7px 2px 10px;"><a tabindex="1" href="https://go.microsoft.com/fwlink/?linkid=2110381" target="_blank" ng-bind="getString('LearnMore')"></a></h2>
                    </div>
                </div>
            </div>
            <div class="tile tile-2-2">
                <h1 id="AddInsNotMeetingHealthGoalsTitle" tabindex="1" style="font-weight: bold;" ng-bind="getString('AddInsNotMeetingHealthGoals')"></h1>
                <div>
                    <div id="AddInsNotMeetingHealthGoals" dashboard-chart chart-status="AddInsNotMeetingHealthGoalsStatus" tabindex="1" ng-keypress="keyPressDrillThrough($event, 'AddInsNotMeetingHealthGoals')"></div>
                    <div>
                        <h2 tabindex="1"style="text-anchor:middle;text-align:center;text-align-last:center; padding:4px 7px 2px 10px;"><a tabindex="1" href="https://go.microsoft.com/fwlink/?linkid=2110381" target="_blank" ng-bind="getString('LearnMore')"></a></h2>
                    </div>
                </div>
            </div>
            <div class="tile tile-2-2">
                <h1 id="MacrosNotMeetingHealthGoalsTitle" tabindex="1" style="font-weight: bold;" ng-bind="getString('MacroNotMeetingHealthGoals')"></h1>
                <div>
                    <div id="MacrosNotMeetingHealthGoals" dashboard-chart chart-status="MacrosNotMeetingHealthGoalsStatus" tabindex="1" ng-keypress="keyPressDrillThrough($event, 'MacrosNotMeetingHealthGoals')"></div>
                    <div>
                        <h2 tabindex="1"style="text-anchor:middle;text-align:center;text-align-last:center; padding:4px 7px 2px 10px;"><a tabindex="1" href="https://go.microsoft.com/fwlink/?linkid=2110381" target="_blank" ng-bind="getString('LearnMore')"></a></h2>
                    </div>
                </div>
            </div>
        </div>  
</body>
</html>
