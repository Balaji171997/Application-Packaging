<!DOCTYPE html>
<html ng-app="dashboard">

<head>
    <title>Health Attestation Dashboard</title>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Health Attestation Dashboard">
    <meta name="keywords" content="Health Attestation, Dashboard">

    <link href="css/columns.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <link href="../css/c3.min.css" rel="stylesheet" type="text/css" />
    <link href="../css/columns.css" rel="stylesheet" type="text/css">

    <script src="../js/angular.min.js" type="text/javascript"></script>
    <script src="../js/d3.min.js" type="text/javascript"></script>
    <script src="../js/c3.min.js" type="text/javascript"></script>
    <script src="../js/utility.js" type="text/javascript"></script>
    <script src="../js/external.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <noscript>Javascript is not enabled</noscript>
</head>

<body ng-controller="dashboardController">
    <div ng-style="{'opacity' : enabled ? 1 : 0.25}">
        <div class="tile-container-2-6">
            <div class="tile-2-2">
                <h1 ng-bind="strings.HASComplianceDonutTitle" tabindex="1">
                </h1>
                <div id="HASComplianceDonut">
                </div>
            </div>
            <div class="tile-2-2">
                <div tabindex="1">
                    <h1 ng-bind="strings.windows10">
                    </h1>
                    <h1 ng-bind="strings.HASUsageTitle">
                    </h1>
                </div>
                <div id="HASUsageDonut">
                </div>
            </div>
            <div class="tile-2-2">
                <h1 ng-bind="strings.devicesInfoTitle" tabindex="1">
                </h1>
                <div id="deviceInfoTreeMap">
                </div>
            </div>
        </div>
        <div class="tile-container-2-6">
            <div class="tile-2-6">
                <h1 ng-bind="strings.HAStopReasonsTitle" tabindex="1">
                </h1>
                <div id="ncSettingsBarChart">
                </div>
            </div>
        </div>
    </div>
    <div class="overlay" ng-if="!enabled">
        <div class="tile-content">
            <div id="overlayMessage" ng-bind="updateHTMLString('overlayMessage', 'overlayMessage')"
                class="tile-content-inner" tabindex="1">
            </div>
        </div>
    </div>
</body>

</html>
