<!DOCTYPE html>
<html ng-app="dashboard" onfocus="skipFocus(event)">
<head>
  <title>Microsoft Defender for Endpoint</title>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Microsoft Defender for Endpoint Dashboard">
  <meta name="keywords" content="Microsoft Defender for Endpoint, Dashboard">

  <link href="../css/c3.min.css" rel="stylesheet" type="text/css">
  <link href="../css/columns.css" rel="stylesheet" type="text/css">
  <link href="css/styles.css" rel="stylesheet" type="text/css">

  <script src="../js/angular.min.js" type="text/javascript"></script>
  <script src="../js/utility.js" type="text/javascript"></script>
  <script src="../js/d3.min.js" type="text/javascript"></script>
  <script src="../js/c3.min.js" type="text/javascript"></script>
  <script src="js/controller.js" type="text/javascript"></script>
  <noscript>JavaScript is not enabled</noscript>

</head>

<body ng-controller="dashboardController" onfocus="skipFocus(event)">
  <div class="tile-container-2-6">
    <div class="tile tile-2-2" data-first tabindex="1">
      <h1 ng-bind="getString('DeploymentStatusChartTitle')"></h1>
      <div id="deployment-status"></div>
    </div>
    <div class="tile tile-2-3" data-last tabindex="2">
      <h1 ng-bind="getString('AgentHealthChartTitle')"></h1>
      <div id="agent-health"></div>
    </div>
  </div>
</body>
</html>
