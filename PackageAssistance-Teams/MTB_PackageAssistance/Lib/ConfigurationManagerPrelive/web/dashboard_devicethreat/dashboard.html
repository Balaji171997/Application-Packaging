<!DOCTYPE html>
<html ng-app="dashboard">
<head>
    <title>Device Threat Protection Dashboard</title>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Device Threat Protection Dashboard">
    <meta name="keywords" content="Device, Threat, Protection, Dashboard">

    <link href="../css/c3.min.css" rel="stylesheet" type="text/css">
    <link href="css/columns.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="../css/c3.min.css" rel="stylesheet" type="text/css" />
    <link href="../css/columns.css" rel="stylesheet" type="text/css">

    <script src="../js/angular.min.js" type="text/javascript" defer></script>
    <script src="../js/d3.min.js" type="text/javascript" defer></script>
    <script src="../js/c3.min.js" type="text/javascript" defer></script>
    <script src="../js/external.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript" defer></script>
    <script src="../js/utility.js" type="text/javascript"></script>
    <noscript>Javascript is not enabled</noscript>
</head>

<body ng-controller="dashboardController">
    <div class="tile-container-2-6">
        <div class="tile-2-2">
            <h1 ng-bind="getString('DeviceThreatStatusTitle')" data-first tabindex="1"></h1>
            <div id="DeviceThreatDonut" tabindex="2">
            </div>
        </div>
        <div class="tile-2-2">
            <h1 ng-bind="getString('DTPComplianceStatusTitle')" tabindex="3"></h1>
            <div id="DTPComplianceDonut" tabindex="4">
            </div>
        </div>
        <div class="tile-2-2">
            <h1 ng-bind="getString('IosDTPStatusTitle')" tabindex="5"></h1>
            <div id="iOSDevicesChart" tabindex="6">
            </div>
        </div>
    </div>
    <div class="tile-container-2-6">
        <div class="tile-2-4">
            <h1 ng-bind="getString('TopThreatCategoriesTitle')" tabindex="7"></h1>
            <div id="TopThreatsChart" tabindex="8">
            </div>
        </div>
        <div class="tile-2-2">
            <h1 ng-bind="getString('AndroidDTPStatusTitle')" tabindex="9"></h1>
            <div id="AndroidDevicesChart" data-last tabindex="10">
            </div>
        </div>
    </div>
</body>
</html>
