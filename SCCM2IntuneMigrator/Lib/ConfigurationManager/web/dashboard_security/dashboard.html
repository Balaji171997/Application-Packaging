<!DOCTYPE html>
<html ng-app="dashboard">
<head>
    <title>Security Dashboard</title>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Security Dashboard">
    <meta name="keywords" content="Security, Dashboard">

    <link href="../css/c3.min.css" rel="stylesheet" type="text/css">
    <link href="css/columns.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">

    <script src="../js/angular.min.js" type="text/javascript"></script>
    <script src="../js/d3.min.js" type="text/javascript"></script>
    <script src="../js/c3.min.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <noscript>Javascript is not enabled</noscript>
</head>

<body ng-controller="dashboardController">
    <div class="tile-container-2-6">
        <div class="tile-2-2" tabindex="1" ng-show="hasPermissions('EPChart')" ng-click="navigateToNode('EnpointProtectionStatusNode')" ng-keypress="keyPressToggle($event, 'EnpointProtectionStatusNode')" ng-style="{'opacity' : epTileEnabled == true ? 1 : 0.5}">
            <h1 ng-bind="getString('protectionHealthDonutTitle')"></h1>
            <div id="EPStatusDonut">
            </div>
        </div>
        <div class="tile-2-2" tabindex="1" ng-show="hasPermissions('DHAChart')" ng-click="navigateToNode('HAStatusNode')" ng-keypress="keyPressToggle($event, 'HAStatusNode')">
            <h1 ng-bind="getString('HASComplianceDonutTitle')"></h1>
            <div id="HASComplianceDonut">
            </div>
        </div>
        <div class="tile-2-2" tabindex="1" ng-show="hasPermissions('WinUpdatesChart')" ng-click="navigateToNode('WinUpdatesDashboardNode')" ng-keypress="keyPressToggle($event, 'WinUpdatesDashboardNode')">
            <h1 ng-bind="getString('winUpdatesDonutTitle')"></h1>
            <div id="updatesComplianceDonut">
            </div>
        </div>
    </div>
        <div class="tile-container-2-6">
            <div class="tile-2-2" tabindex="1" ng-show="hasPermissions('DeviceThreatChart')">
                <h1 ng-bind="getString('deviceThreatDonutTitle')"></h1>
                <div id="DeviceThreatDonut">
                </div>
            </div>
        </div>
</body>
</html>
