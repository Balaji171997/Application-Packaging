<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html ng-app="dashboard" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Package Conversion Manager Dashboard</title>
    <meta charset="UTF-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Package Conversion Manager Dashboard" />
    <meta name="keywords" content="Software Distribution, Package Conversion Manager, Dashboard" />

    <link href="../css/c3.min.css" rel="stylesheet" type="text/css" />
    <link href="../css/columns.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />

    <script src="../js/angular.min.js" type="text/javascript"></script>
    <script src="../js/d3.min.js" type="text/javascript"></script>
    <script src="../js/c3.min.js" type="text/javascript"></script>
    <script src="../js/utility.js" type="text/javascript"></script>
    <script src="../js/external.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>

    <noscript>Javascript is not enabled</noscript>
</head>

<body id="dashboardBody" ng-controller="dashboardController">
    <script>
    async function drillThroughPackage(nodeName) {
        var controllerElement = document.getElementById('dashboardBody');
        var scope = angular.element(controllerElement).scope();
        scope.drillThroughPackage(nodeName);
    }
    </script>
<div class="tile-container-1-4-2">
    <div class="tile tile-2-2" tabindex="1">
        <h3 ng-bind="strings.TotalPackagesScannedTitle" tabindex="1"></h3>
        <div id="PackageAnalyzedGauge" tabindex="1" onkeypress="drillThroughPackage('DrillThroughPackageAnalyzedGauge');"></div>
    </div>
    <div class="tile tile-2-2" tabindex="1">
        <h3 ng-bind="strings.ConversionSuccessTitle" tabindex="1"></h3>
        <div id="PackageConvertGauge" tabindex="1" onkeypress="drillThroughPackage('DrillThroughPackageConvertGauge');"></div>
    </div>
</div>
<div class="tile-container-1-4-2">
    <div class="tile tile-2-4" tabindex="1">
        <h3 ng-bind="strings.ConversionReadinessTitle" tabindex="1"></h3>
        <div id="PackageStatusPie" tabindex="1"></div>
    </div>
</div>
</body>
</html>
