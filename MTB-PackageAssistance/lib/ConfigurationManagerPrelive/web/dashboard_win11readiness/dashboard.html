<!DOCTYPE html>

<html ng-app="dashboard">
<head>
    <meta charset="utf-8" />
    <title>Windows 11 Readiness Dashboard</title>
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Win11 Readiness Dashboard containing data about health of devices" />
    <meta name="keywords" content="Win 11, Readiness, Dashboard" />
    
    <link href="../css/c3.min.css" rel="stylesheet" type="text/css" />
    <link href="../css/columns.css" rel="stylesheet" type="text/css" />
    <link href="css/columns.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css" />


    <script src="../js/angular.min.js" type="text/javascript"></script>
    <script src="../js/utility.js" type="text/javascript"></script>
    <script src="../js/d3.min.js" type="text/javascript"></script>
    <script src="../js/c3.min.js" type="text/javascript"></script>
    <script src="../js/external.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <noscript>Javascript is not enabled</noscript>
</head>

<body id="Win11ReadinessDashboardBody" ng-controller="dashboardController" tabindex="0">

    <div class="W11ReadinessDashboardDiv" tabindex="-1">
        <br class="clear">
        <div ng-if="CollectionsData == ChartState.DataReady">
            <label for="SMS_DeviceCollections" ng-bind="strings.DeviceCollection"></label>
            <select name="SMS_DeviceCollections" id="SMS_DeviceCollectionsSelector" ng-options="collection as collection.Name for collection in SMS_DeviceCollections.All" ng-model="SMS_DeviceCollections.Selected" ng-change="SMS_DeviceCollectionChanged()" tabindex="0" aria-label="{{strings.DeviceCollection}}"></select>
            <button type="button" ng-click="LaunchWizardCollectionPicker()" ng-bind="strings.Browse" tabindex="0" aria-label="{{strings.Browse}}"></button>
        </div>
        <br class="clear">
        <div class="tile-container-2-6" tabindex="-1">
            <div class="tile-2-3" tabindex="-1">
                <h1 tabindex="-1" ng-bind="strings.W11Usage"></h1>
                <button class="link" id="showWinDevicesBarButton" ng-click="toggleWinDeviceBar()" aria-label="{{strings.W11Usage+strings.ShowTable}}">{{strings.ShowTable}}</button>
                <div id="windows-usage-table" class="windows-usage-table"></div>
                <div id="Win11DevicesChart" tabindex="0" 
                aria-label="{{strings.W11Usage}}"></div>
            </div>
            <div class="tile-2-6" tabindex="=-1">
                <h1 ng-bind="strings.W10Usage" tabindex="-1"></h1>
                <button class="link" id="showW10UsageChartButton" ng-click="toggleFeatureDonutChart()" aria-label="{{strings.W10Usage+strings.ShowTable}}">{{strings.ShowTable}}</button>
                <div id="feature-usage-table" class="windows-usage-table">
                </div>
                <div id="W10-usage" aria-label="{{strings.W10Usage}}" tabindex="0">
                </div>
            </div>
        </div>
        <br class="clear">
        <div class="tile-container-2-6" tabindex="-1">
            <div class="tile-2-4" tabindex="-1">
                <h1 ng-bind="strings.UpgradeExperience" tabindex="-1"></h1>
                <br class="clear">
                <div id="upgradeExperienceChart" tabindex="0" aria-label="{{strings.UpgradeExperience}}">
                </div>
            </div>
            <div class="tile-2-5 " tabindex="-1">
               <h1 ng-bind="strings.Win11HardwareRequirement" tabindex="-1"></h1>
               <div id="Win11HardwareRequirementChart"  tabindex="0" aria-label="{{strings.Win11HardwareRequirement}}">
               </div>
            </div>
        </div>
    </div>
   
</body>
</html>
