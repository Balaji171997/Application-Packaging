<!DOCTYPE html>
<html ng-app="dashboard">
<head>
    <meta charset="utf-8" />
    <title>Edge Updates Dashboard</title>
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Edge Updates Dashboard" />
    <meta name="keywords" content="Edge, Dashboard" />

    <link href="../css/c3.min.css" rel="stylesheet" type="text/css" />
    <link href="../css/columns.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />

    <script src="../js/angular.min.js" type="text/javascript"></script>
    <script src="../js/utility.js" type="text/javascript"></script>
    <script src="../js/external.js" type="text/javascript"></script>
    <script src="../js/d3.min.js" type="text/javascript"></script>
    <script src="../js/c3.min.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <noscript>Javascript is not enabled</noscript>
</head>
<body id="EdgeClientsDashboardBody" ng-controller="dashboardController" tabindex="1">
    <div id="EdgeClientsDashboardBodyDiv" tabindex="1">
        <br class="clear">
        <div ng-if="CollectionsData == ChartState.DataReady">
            <label for="SMS_DeviceCollections" ng-bind="strings.DeviceCollection"></label>
            <select name="SMS_DeviceCollections" id="SMS_DeviceCollectionsSelector" ng-options="collection as collection.Name for collection in SMS_DeviceCollections.All" ng-model="SMS_DeviceCollections.Selected" ng-change="SMS_DeviceCollectionChanged()" tabindex="1" aria-label="{{strings.DeviceCollection}}"></select>
            <button type="button" ng-click="LaunchWizardCollectionPicker()" ng-bind="strings.Browse" tabindex="1" aria-label="{{strings.Browse}}"></button>
        </div>
        <br class="clear">
        <div class="tile-container-2-6">
            <div class="tile tile-2-2">
                <h1 id="EdgeDevicesTitle" tabindex="1" ng-bind="strings.DevicesWithEdge"></h1>
                <div id="EdgeDevices" dashboard-chart chart-status="EdgeDevicesData" tabindex="1" aria-label="{{strings.DevicesWithEdge}}">
                </div>
            </div>
            <div class="tile tile-2-2">
                <h1 id="InstalledBrowsersTitle" tabindex="1" ng-bind="strings.InstalledBrowsers"></h1>
                <div id="InstalledBrowsers" dashboard-chart chart-status="InstalledBrowsersData" tabindex="1" aria-label="{{strings.InstalledBrowsers}}">
                </div>
            </div>
            <div class="tile tile-2-2">
                <h1 id="DefaultBrowsersTitle" tabindex="1" ng-bind="strings.DefaultBrowser"></h1>
                <div id="DefaultBrowsers" dashboard-chart chart-status="DefaultBrowsersData" tabindex="1" aria-label="{{strings.DefaultBrowser}}">
                </div>
            </div>
        </div>
        <br class="clear">
        <div class="tile-container-2-6">
            <div class="tile tile-2-3">
                <h1 id="EdgeVersionTitle" tabindex="1" ng-bind="strings.EdgeVersions"></h1>
                <div id="EdgeVersion" dashboard-chart chart-status="VersionsData" tabindex="1" aria-label="{{strings.EdgeVersions}}">
                </div>
            </div>
            <div class="tile tile-2-3" style="width: 520px;">
                <h1 id="EdgeUsageTitle" tabindex="1" ng-bind="strings.PreferredBrowsers"></h1>
                <div id="EdgeUsage" dashboard-chart chart-status="UsageData" tabindex="1" aria-label="{{strings.PreferredBrowsers}}">
                </div>
            </div>
            <!--
        <div class="tile tile-2-2">
            <h1 id="EdgeClientsTitle" tabindex="1" ng-bind="getString('DefaultBrowser')" aria-label=""></h1>
        </div>
        -->
        </div>

    </div>
</body>
</html>
